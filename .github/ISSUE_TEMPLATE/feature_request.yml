name: 功能建议
description: 描述使用场景、现有困难和希望增加或改进的能力。
title: "[功能建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请先搜索已有 Issue，尽量围绕一个具体场景说明需求。
        示例、截图和附件请使用虚构或脱敏数据，不要提交凭据或真实房源联系信息。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读相关说明并搜索已有 Issue，未找到相同建议。
          required: true
        - label: 我已移除描述、截图和附件中的凭据及个人信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
      description: 谁在什么场景下遇到了什么困难？当前行为为什么不能满足需要？
      placeholder: 例如：核对……费用时，目前需要手动……，容易出现……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的解决方案
      description: 描述希望增加或改变的行为，并给出一个可以判断是否实现的例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）
      description: 是否尝试过现有功能、调整表格或其他方法？这些方法有什么不足？
  - type: textarea
    id: impact
    attributes:
      label: 影响范围与补充信息（可选）
      description: 如涉及数据保存、模型调用费用、远程部署、多用户、旧模板兼容或数据库迁移，请说明预期；也可以附脱敏示意图。
