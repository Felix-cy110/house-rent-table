name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-template:
    name: 检查租房模板
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v6
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 检查模板
        run: python .github/scripts/check_template.py
