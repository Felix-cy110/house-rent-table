name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端与 MySQL 持久化
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: rental_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      RENT_TEST_MYSQL_DSN: root:ci-test-only@tcp(127.0.0.1:3306)/rental_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
  check-template:
    name: 检查租房模板
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v6
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 检查模板
        run: python .github/scripts/check_template.py
